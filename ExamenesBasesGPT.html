<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fundamentos de Enfermería — Simulador</title>

<style>
:root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #687386;
    --primary: #315efb;
    --primary-light: #eaf0ff;
    --border: #dce2ec;
    --correct: #16804b;
    --correct-bg: #eaf8f0;
    --wrong: #c83c4b;
    --wrong-bg: #fff0f2;
    --shadow: 0 5px 20px rgba(20,30,50,0.07);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    line-height: 1.5;
}

button,
select {
    font: inherit;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 25px 16px 50px;
}

header {
    margin-bottom: 20px;
}

h1 {
    margin: 0 0 5px;
    font-size: clamp(1.5rem, 3vw, 2.2rem);
}

.subtitle {
    margin: 0;
    color: var(--muted);
}

/* EXAM TABS */

.exam-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.exam-tab {
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: white;
    cursor: pointer;
    font-weight: 700;
}

.exam-tab:hover {
    border-color: var(--primary);
}

.exam-tab.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

/* TOOLBAR */

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

select,
.button {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: white;
    cursor: pointer;
}

.button:hover {
    border-color: var(--primary);
}

.button.primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

.button.danger {
    background: var(--wrong);
    color: white;
    border-color: var(--wrong);
}

/* PROGRESS */

.progress-container {
    margin-bottom: 20px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 6px;
}

.progress {
    height: 9px;
    width: 100%;
    background: #e2e6ed;
    border-radius: 99px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 0.25s ease;
}

/* CARD */

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 25px;
    box-shadow: var(--shadow);
}

.question-number {
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 10px;
}

.question {
    font-size: 1.18rem;
    font-weight: 750;
    margin: 0 0 20px;
}

/* OPTIONS */

.options {
    display: grid;
    gap: 11px;
}

.option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
    cursor: pointer;
    text-align: left;
    transition: 0.15s;
}

.option:hover {
    border-color: var(--primary);
    background: #fafbff;
}

.option.selected {
    border-color: var(--primary);
    background: var(--primary-light);
}

.option input {
    margin-top: 4px;
    accent-color: var(--primary);
}

.option-letter {
    font-weight: 800;
    min-width: 22px;
}

/* NAVIGATION */

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 22px;
}

.navigation-right {
    display: flex;
    gap: 10px;
}

/* RESULT */

.result {
    text-align: center;
}

.result-title {
    margin-top: 0;
}

.score {
    font-size: 3.2rem;
    font-weight: 850;
    margin: 10px 0;
}

.percentage {
    color: var(--muted);
    font-size: 1.2rem;
}

.result-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 25px 0;
}

/* REVIEW */

.review {
    margin-top: 25px;
    display: grid;
    gap: 12px;
}

.review-item {
    padding: 15px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: left;
}

.review-item.correct {
    border-left: 5px solid var(--correct);
}

.review-item.wrong {
    border-left: 5px solid var(--wrong);
}

.review-status {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 99px;
    margin-bottom: 8px;
}

.review-status.correct {
    color: var(--correct);
    background: var(--correct-bg);
}

.review-status.wrong {
    color: var(--wrong);
    background: var(--wrong-bg);
}

.review-question {
    font-weight: 700;
    margin-bottom: 8px;
}

.answer-line {
    font-size: 0.92rem;
    color: var(--muted);
    margin-top: 4px;
}

.answer-line strong {
    color: var(--text);
}

.hidden {
    display: none !important;
}

.feedback {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    font-weight: 700;
}

.feedback.correct {
    background: var(--correct-bg);
    color: var(--correct);
}

.feedback.wrong {
    background: var(--wrong-bg);
    color: var(--wrong);
}

/* RESPONSIVE */

@media (max-width: 600px) {

    .container {
        padding: 18px 10px 40px;
    }

    .card {
        padding: 17px;
    }

    .navigation {
        flex-direction: column;
    }

    .navigation-right {
        width: 100%;
    }

    .navigation-right button {
        flex: 1;
    }

    .score {
        font-size: 2.7rem;
    }
}
</style>
</head>

/* =========================================================
   ESTADO DE LA APLICACIÓN
   ========================================================= */

let currentExam = "A";

let currentQuestion = 0;

let answers = [];

let finished = false;

let correctionMode = "final";


/* =========================================================
   ELEMENTOS HTML
   ========================================================= */

const quizContainer =
    document.getElementById("quizContainer");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const answeredText =
    document.getElementById("answeredText");

const correctionSelect =
    document.getElementById("correctionMode");

const restartButton =
    document.getElementById("restartButton");

const examTabs =
    document.querySelectorAll(".exam-tab");


/* =========================================================
   INICIALIZAR EXAMEN
   ========================================================= */

function initializeExam(exam) {

    currentExam = exam;

    currentQuestion = 0;

    finished = false;

    answers =
        new Array(EXAMS[currentExam].length).fill(null);

    updateTabs();

    renderQuestion();

}


/* =========================================================
   ACTUALIZAR PESTAÑAS
   ========================================================= */

function updateTabs() {

    examTabs.forEach(tab => {

        tab.classList.toggle(
            "active",
            tab.dataset.exam === currentExam
        );

    });

}


/* =========================================================
   RENDERIZAR PREGUNTA
   ========================================================= */

function renderQuestion() {

    const questions = EXAMS[currentExam];

    const question = questions[currentQuestion];

    const selected = answers[currentQuestion];

    const total = questions.length;

    const answered =
        answers.filter(answer => answer !== null).length;


    progressText.textContent =
        `Pregunta ${currentQuestion + 1} de ${total}`;

    answeredText.textContent =
        `Respondidas: ${answered}/${total}`;

    progressBar.style.width =
        `${((currentQuestion + 1) / total) * 100}%`;


    quizContainer.innerHTML = "";


    const number =
        document.createElement("div");

    number.className = "question-number";

    number.textContent =
        `${currentExam === "A"
            ? "Examen A"
            : currentExam === "B"
                ? "Examen B"
                : "Examen C"
        } · Pregunta ${currentQuestion + 1}`;


    const questionTitle =
        document.createElement("h2");

    questionTitle.className = "question";

    questionTitle.textContent =
        question.q;


    const options =
        document.createElement("div");

    options.className = "options";


    question.o.forEach((optionText, index) => {

        const label =
            document.createElement("label");

        label.className =
            "option" +
            (selected === index
                ? " selected"
                : "");


        const radio =
            document.createElement("input");

        radio.type = "radio";

        radio.name = "answer";

        radio.value = index;

        radio.checked =
            selected === index;


        radio.addEventListener(
            "change",
            () => selectAnswer(index)
        );


        const letter =
            document.createElement("span");

        letter.className =
            "option-letter";

        letter.textContent =
            ["a)", "b)", "c)", "d)"][index];


        const text =
            document.createElement("span");

        text.textContent =
            optionText;


        label.appendChild(radio);

        label.appendChild(letter);

        label.appendChild(text);

        options.appendChild(label);

    });


    quizContainer.appendChild(number);

    quizContainer.appendChild(questionTitle);

    quizContainer.appendChild(options);


    /* FEEDBACK INMEDIATO */

    if (
        correctionMode === "instant" &&
        selected !== null
    ) {

        const feedback =
            document.createElement("div");

        if (selected === question.a) {

            feedback.className =
                "feedback correct";

            feedback.textContent =
                "✓ Correcta";

        } else {

            feedback.className =
                "feedback wrong";

            feedback.textContent =
                "✗ Incorrecta. La respuesta correcta es " +
                ["a", "b", "c", "d"][question.a] +
                ") " +
                question.o[question.a];

        }

        quizContainer.appendChild(feedback);

    }


    /* NAVEGACIÓN */

    const navigation =
        document.createElement("div");

    navigation.className =
        "navigation";


    const previous =
        document.createElement("button");

    previous.className =
        "button";

    previous.textContent =
        "← Anterior";

    previous.disabled =
        currentQuestion === 0;


    previous.addEventListener(
        "click",
        () => {

            if (currentQuestion > 0) {

                currentQuestion--;

                renderQuestion();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }

        }
    );


    const rightButtons =
        document.createElement("div");

    rightButtons.className =
        "navigation-right";


    const next =
        document.createElement("button");

    next.className =
        "button primary";


    if (currentQuestion === total - 1) {

        next.textContent =
            "Finalizar examen";

    } else {

        next.textContent =
            "Siguiente →";

    }


    next.addEventListener(
        "click",
        () => {

            if (currentQuestion === total - 1) {

                finishExam();

            } else {

                currentQuestion++;

                renderQuestion();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }

        }
    );


    rightButtons.appendChild(next);

    navigation.appendChild(previous);

    navigation.appendChild(rightButtons);

    quizContainer.appendChild(navigation);

}


/* =========================================================
   SELECCIONAR RESPUESTA
   ========================================================= */

function selectAnswer(index) {

    answers[currentQuestion] = index;

    renderQuestion();

}


/* =========================================================
   FINALIZAR EXAMEN
   ========================================================= */

function finishExam() {

    finished = true;

    renderResults();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   RESULTADOS
   ========================================================= */

function renderResults() {

    const questions =
        EXAMS[currentExam];

    let score = 0;


    questions.forEach((question, index) => {

        if (
            answers[index] === question.a
        ) {

            score++;

        }

    });


    const total =
        questions.length;

    const percentage =
        Math.round((score / total) * 100);


    progressText.textContent =
        "Examen terminado";

    answeredText.textContent =
        `Respondidas: ${answers.filter(x => x !== null).length}/${total}`;

    progressBar.style.width =
        "100%";


    quizContainer.innerHTML = "";


    const result =
        document.createElement("div");

    result.className =
        "result";


    const title =
        document.createElement("h2");

    title.className =
        "result-title";

    title.textContent =
        `Resultado — Examen ${currentExam}`;


    const scoreElement =
        document.createElement("div");

    scoreElement.className =
        "score";

    scoreElement.textContent =
        `${score}/${total}`;


    const percentageElement =
        document.createElement("div");

    percentageElement.className =
        "percentage";

    percentageElement.textContent =
        `${percentage}%`;


    const description =
        document.createElement("p");

    description.textContent =
        "Revisa pregunta por pregunta tus respuestas y la alternativa correcta.";


    const actions =
        document.createElement("div");

    actions.className =
        "result-actions";


    const retry =
        document.createElement("button");

    retry.className =
        "button primary";

    retry.textContent =
        "Reintentar examen";


    retry.addEventListener(
        "click",
        () => initializeExam(currentExam)
    );


    const another =
        document.createElement("button");

    another.className =
        "button";

    another.textContent =
        "Volver al inicio";


    another.addEventListener(
        "click",
        () => {

            initializeExam("A");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );


    actions.appendChild(another);

    actions.appendChild(retry);


    result.appendChild(title);

    result.appendChild(scoreElement);

    result.appendChild(percentageElement);

    result.appendChild(description);

    result.appendChild(actions);


    /* =====================================================
       REVISION
       ===================================================== */

    const reviewTitle =
        document.createElement("h3");

    reviewTitle.textContent =
        "Revisión de respuestas";


    result.appendChild(reviewTitle);


    const review =
        document.createElement("div");

    review.className =
        "review";


    questions.forEach(
        (question, index) => {

            const userAnswer =
                answers[index];

            const correct =
                userAnswer === question.a;


            const item =
                document.createElement("div");

            item.className =
                "review-item " +
                (correct
                    ? "correct"
                    : "wrong");


            const status =
                document.createElement("span");

            status.className =
                "review-status " +
                (correct
                    ? "correct"
                    : "wrong");


            status.textContent =
                correct
                    ? "✓ Correcta"
                    : "✗ Incorrecta";


            const questionText =
                document.createElement("div");

            questionText.className =
                "review-question";

            questionText.textContent =
                `${index + 1}. ${question.q}`;


            const yourAnswer =
                document.createElement("div");

            yourAnswer.className =
                "answer-line";


            if (userAnswer === null) {

                yourAnswer.innerHTML =
                    "<strong>Tu respuesta:</strong> Sin responder";

            } else {

                yourAnswer.innerHTML =
                    "<strong>Tu respuesta:</strong> " +
                    ["a", "b", "c", "d"][userAnswer] +
                    ") " +
                    question.o[userAnswer];

            }


            const correctAnswer =
                document.createElement("div");

            correctAnswer.className =
                "answer-line";

            correctAnswer.innerHTML =
                "<strong>Respuesta correcta:</strong> " +
                ["a", "b", "c", "d"][question.a] +
                ") " +
                question.o[question.a];


            item.appendChild(status);

            item.appendChild(questionText);

            item.appendChild(yourAnswer);

            item.appendChild(correctAnswer);

            review.appendChild(item);

        }
    );


    result.appendChild(review);

    quizContainer.appendChild(result);

}


/* =========================================================
   CAMBIAR EXAMEN
   ========================================================= */

examTabs.forEach(tab => {

    tab.addEventListener(
        "click",
        () => {

            initializeExam(
                tab.dataset.exam
            );

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );

});


/* =========================================================
   BOTÓN REINICIAR
   ========================================================= */

restartButton.addEventListener(
    "click",
    () => {

        initializeExam(currentExam);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* =========================================================
   MODO DE CORRECCIÓN
   ========================================================= */

correctionSelect.addEventListener(
    "change",
    event => {

        correctionMode =
            event.target.value;

        if (!finished) {

            renderQuestion();

        }

    }
);


/* =========================================================
   INICIAR
   ========================================================= */

initializeExam("A");

</script>
